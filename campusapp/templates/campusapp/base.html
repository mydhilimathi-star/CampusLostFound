<!DOCTYPE html>
<html>

<head>

    <title>Campus Lost & Found</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
        }

        .navbar {
            background: #172554;
        }

        .hero {
            background: linear-gradient(
                135deg,
                #172554,
                #2563eb
            );

            color: white;

            padding: 55px 20px;

            border-radius: 0 0 25px 25px;
        }

        .card {
            border: none;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        .filter-btn {
            min-width: 110px;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'home' %}">

            🎓 Campus Lost & Found

        </a>


        <div>

            {% if user.is_authenticated %}

                <span class="text-white me-2">

                    Hi, {{ user.username }}

                </span>

                <a
                    href="{% url 'item_create' %}"
                    class="btn btn-warning btn-sm">

                    + Report Item

                </a>

                <a
                    href="{% url 'logout' %}"
                    class="btn btn-light btn-sm">

                    Logout

                </a>

            {% else %}

                <a
                    href="{% url 'login' %}"
                    class="btn btn-light btn-sm">

                    Login

                </a>

                <a
                    href="{% url 'register' %}"
                    class="btn btn-warning btn-sm">

                    Register

                </a>

            {% endif %}

        </div>

    </div>

</nav>


{% block content %}

{% endblock %}


</body>

</html>
