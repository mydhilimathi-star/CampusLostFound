```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Campus Lost & Found</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .register-container {
            width: 90%;
            max-width: 450px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;

            color: #333;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .register-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .register-button:hover {
            background: #5568d8;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .login-link a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .errors {
            background: #ffe5e5;

            color: #c62828;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .help-text {
            font-size: 12px;

            color: #888;

            margin-top: 5px;
        }

    </style>
</head>


<body>

    <div class="register-container">

        <h1>Create Account</h1>

        <p class="subtitle">
            Join Campus Lost & Found
        </p>


        {% if form.errors %}

            <div class="errors">

                {{ form.errors }}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="{{ form.username.id_for_label }}">
                    Username
                </label>

                {{ form.username }}

                <div class="help-text">
                    Choose a username for your account.
                </div>

            </div>


            <div class="form-group">

                <label for="{{ form.password1.id_for_label }}">
                    Password
                </label>

                {{ form.password1 }}

            </div>


            <div class="form-group">

                <label for="{{ form.password2.id_for_label }}">
                    Confirm Password
                </label>

                {{ form.password2 }}

            </div>


            <button
                type="submit"
                class="register-button">

                Create Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</body>

</html>
